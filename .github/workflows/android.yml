name: Onda Android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK packages
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify taste ranking
        run: node --experimental-strip-types --test supabase/functions/recommendations/ranking.test.ts
      - name: Verify tests, compile and lint
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: onda-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-debug.*
